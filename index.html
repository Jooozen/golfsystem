<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゴルフ場 顧客管理システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">&#9971;</span>
          <span class="logo-text">GolfCRM</span>
        </div>
      </div>
      <ul class="nav-menu">
        <li class="nav-item active" data-page="dashboard">
          <span class="nav-icon">&#9632;</span>
          <span>ダッシュボード</span>
        </li>
        <li class="nav-item" data-page="customers">
          <span class="nav-icon">&#9787;</span>
          <span>顧客管理</span>
        </li>
        <li class="nav-item" data-page="reservations">
          <span class="nav-icon">&#9993;</span>
          <span>予約管理</span>
        </li>
        <li class="nav-item" data-page="visit-history">
          <span class="nav-icon">&#9776;</span>
          <span>来場履歴</span>
        </li>
        <li class="nav-item" data-page="membership">
          <span class="nav-icon">&#9733;</span>
          <span>会員種別・料金</span>
        </li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">管</div>
          <div class="user-detail">
            <div class="user-name">管理者</div>
            <div class="user-role">システム管理者</div>
          </div>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <header class="top-bar">
        <h1 class="page-title" id="pageTitle">ダッシュボード</h1>
        <div class="top-bar-actions">
          <div class="search-box">
            <input type="text" placeholder="顧客名・会員番号で検索..." id="globalSearch">
          </div>
          <div class="notification-bell">
            <span>&#128276;</span>
            <span class="badge">3</span>
          </div>
        </div>
      </header>

      <div class="page-content" id="pageContent">
        <!-- Pages are rendered here by JS -->
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
